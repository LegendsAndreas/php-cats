services:
  app:
    build:
      context: .
    env_file: ".env"
    environment:
      - APP_ENV=development
    depends_on:
      - db
    networks:
      - web

  caddy:
    image: caddy:2
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
      - "8090:8090"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      - app
    networks:
      - web

  db:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: cakephp
      MYSQL_USER: cakephpuser
      MYSQL_PASSWORD: cakephp_password
    volumes:
      - db_data:/var/lib/mysql
    networks:
      - web

networks:
  web:

volumes:
  db_data:
  caddy_data:
  caddy_config: